services:
  # Primary PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: stockpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockpilot_user
      POSTGRES_PASSWORD: stockpilot_pass
      POSTGRES_DB: stockpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot_user -d stockpilot_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Distributed Cache & Rate Limiting (Redis)
  redis:
    image: redis:7-alpine
    container_name: stockpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - infra

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

